[package]
name = "azphysics"
description = "Physik-Simulationen auf azmath: Kollisionsgeometrie, Gewebe, Strömung"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Standard: no_std ohne alloc, Elementarfunktionen über libm.
default = ["libm"]
# Rechen-Backends, durchgereicht an azmath.
libm = ["azmath/libm"]
std = ["azmath/std", "alloc"]
# Simulationen mit eigenem Speicher: Gewebe, Strömung, Suchstruktur.
alloc = ["azmath/alloc"]

[dependencies]
azmath = { workspace = true }

[dev-dependencies]
azviz = { path = "../azviz", version = "=0.1.1" }

[lints]
workspace = true

# Die Beispiele zeigen die Simulationen im Fenster und brauchen dafür den Heap:
#   cargo demo cloth_drape

[[example]]
name = "fluid_dam_break"
required-features = ["std"]

[[example]]
name = "fluid_smoke"
required-features = ["std"]

[[example]]
name = "fluid_vortex_street"
required-features = ["std"]

[[example]]
name = "cloth_drape"
required-features = ["std"]

[[example]]
name = "cloth_fold"
required-features = ["std"]

[[example]]
name = "cloth_tunnelling"
required-features = ["std"]

[[example]]
name = "cloth_free_flight"
required-features = ["std"]

[[example]]
name = "fluid_rest_lab"
required-features = ["std"]
