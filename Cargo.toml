[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
publish = false

# Zentrale Versionsverwaltung: Crates referenzieren Abhängigkeiten nur über
# `workspace = true`, damit es pro Abhängigkeit genau eine Version gibt.
[workspace.dependencies]
azmath = { path = "crates/azmath", default-features = false }
libm = { version = "0.2", default-features = false }
rayon = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# no_std-Hygiene: core/alloc statt std, wo möglich
std_instead_of_core = "forbid"
std_instead_of_alloc = "forbid"
alloc_instead_of_core = "forbid"
# Keine Panics in Bibliotheksfunktionen (Fehler als Result)
unwrap_used = "forbid"
panic = "forbid"
